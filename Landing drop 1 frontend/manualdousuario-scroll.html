      --sw-bg: #0c0a07;
      --sw-ink: #f1e9d2;
      --sw-ink-soft: #c6b582;
      --sw-accent: #b8472a;

      --ink-soft:   #1a1611;
      --paper:      #d6c692;
      --paper-2:    #c6b582;
      --paper-3:    #b5a370;
      --paper-deep: #8c7c4f;

      --rust:       #b8472a;
      --rust-deep:  #832d18;

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--ink);
      color: var(--bone);
      font-family: var(--sw-font-body);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

      position: fixed; inset: 0;

      mix-blend-mode: overlay;
      opacity: .4;
      z-index: 1000;
    }

      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: rgba(12, 10, 7, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(214, 198, 146, 0.15);
      z-index: 500;
    }
    .tiw-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--bone);
      font-family: 'Archivo Black', sans-serif;
      font-size: 17px;
      letter-spacing: .02em;
      text-transform: uppercase;
    }
    .tiw-brand img {
      width: 32px;
      height: 32px;
      border: 1px solid var(--paper-deep);
      border-radius: 4px;
      object-fit: cover;
    }
    .tiw-brand-badge {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      padding: 3px 7px;
      border: 1px solid var(--rust);
      color: var(--rust);
      letter-spacing: .15em;
      border-radius: 2px;
    }
    .tiw-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-read-toggle {
      background: rgba(241, 233, 210, 0.08);
      border: 1px solid rgba(214, 198, 146, 0.3);
      color: var(--bone);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      padding: 8px 14px;
      border-radius: 2px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: .12em;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all .2s ease;
    }
    .btn-read-toggle:hover {
      background: var(--rust);
      border-color: var(--rust);
      color: var(--off);
    }
    .btn-shop {
      background: var(--rust);
      color: var(--off);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      padding: 8px 16px;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: .14em;
      font-weight: 500;
      border-radius: 2px;
      transition: background .2s;
    }
    .btn-shop:hover { background: var(--rust-deep); }

    /* CHAPTER DRAWER (SLIDE-OVER PANEL FOR IN-DEPTH READING) */
    .drawer-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 1200;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
    }
    .drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .drawer-content {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: min(720px, 92vw);
      background: var(--bone);
      color: var(--ink);
      z-index: 1250;

      transform: translateX(100%);

      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .drawer-overlay.active .drawer-content {
      transform: translateX(0);
    }
    .drawer-header {
      padding: 24px 32px;
      background: var(--ink);
      color: var(--bone);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--rust);

      font-size: 24px;
      letter-spacing: .02em;
      text-transform: uppercase;
      color: var(--off);

      border: 1px solid rgba(255,255,255,.2);
      color: var(--bone);
      font-size: 20px;
      width: 36px; height: 36px;

      place-items: center;
      border-radius: 50%;

      transition: background .2s;

      background: var(--rust);
      border-color: var(--rust);

      padding: 36px 32px 80px;
      overflow-y: auto;
      line-height: 1.7;
    }
    .drawer-body h2 {
      font-family: 'Anton', sans-serif;
      font-size: clamp(32px, 5vw, 48px);
      text-transform: uppercase;
      line-height: .95;
      margin-bottom: 20px;
      color: var(--ink);

    .drawer-body p {
      font-size: 16px;
      color: var(--ink-soft);
      margin-bottom: 20px;
    }
    .drawer-body strong { color: var(--ink); font-weight: 700; }

    /* EDITORIAL CARDS IN DRAWER */
    .drawer-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin: 28px 0;
    }
    .drawer-card {
      background: var(--bone-2);
      border: 1.5px solid var(--ink);
      padding: 20px;
      position: relative;
    }
    .drawer-card::before {
      content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
      background: var(--rust);
    }
    .drawer-card h4 {
      font-family: 'Anton', sans-serif;
      font-size: 20px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .drawer-card p {
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 0;
    }

    /* TABLES IN DRAWER */
    .drawer-table-wrap {
      overflow-x: auto;
      margin: 28px 0;
      border: 1.5px solid var(--ink);
    }
    .drawer-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .drawer-table thead {
      background: var(--ink);
      color: var(--off);
      font-family: 'DM Mono', monospace;
      text-transform: uppercase;
      letter-spacing: .1em;
      font-size: 11px;

    .drawer-table th, .drawer-table td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--paper-3);
    }
    .drawer-table tbody tr:nth-child(even) {
      background: var(--bone-2);
    }

    /* WARNING BOX IN DRAWER */
    .drawer-alert {
      background: var(--bone-2);
      border: 1.5px solid var(--ink);
      border-left: 5px solid var(--rust);
      padding: 20px;
      margin: 28px 0;
    }
    .drawer-alert-title {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--rust);
      font-weight: 700;
      margin-bottom: 8px;
    }

    /* ACCORDION IN DRAWER */
    .acord-item {
      border: 1.5px solid var(--ink);
      margin-bottom: 12px;
      background: var(--bone-2);
    }
    .acord-btn {
      width: 100%;
      padding: 16px 20px;
      background: transparent;
      border: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Anton', sans-serif;
      font-size: 19px;
      text-transform: uppercase;
      letter-spacing: .02em;
      cursor: pointer;
      color: var(--ink);
      text-align: left;
    }
    .acord-btn.ativo {
      background: var(--ink);
      color: var(--off);
    }
    .acord-conteudo {
      max-height: 0;
      overflow: hidden;
      transition: max-height .3s ease-out;
    }
    .acord-conteudo-inner {
      padding: 20px;
      border-top: 1px solid var(--paper-3);
    }

    /* SCENE OVERLAY ACTION BUTTON */
    .btn-chapter-view {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      background: var(--rust);
      color: var(--off);
      border: 0;
      padding: 12px 22px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .15em;
      font-weight: 500;
      cursor: pointer;
      border-radius: 2px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      transition: all .2s ease;
    }
    .btn-chapter-view:hover {
      background: #cf4f2f;
      transform: translateY(-2px);
    }
    .btn-chapter-view svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* MOBILE TUNING */
    @media (max-width: 860px) {
      .tiw-topbar { padding: 0 16px; height: 56px; }
      .tiw-brand span { display: none; }
      .drawer-content { width: 100vw; }
      .drawer-header { padding: 18px 20px; }
      .drawer-body { padding: 24px 20px 60px; }
    }
  </style>
</head>
